name: Test

on:
  push:
  pull_request:

jobs:
  root-tests:
    name: Root (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx jest --ci --watchAll=false
